name: Build "turnip_a660"

on:
  workflow_dispatch:
  schedule:
  - cron: "20 5 1,15 * *"

permissions:
  contents: write

jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3

    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt build-dep mesa -y
        sudo apt install -y meson ninja-build

    - name: Execute build script
      run: bash ./turnip_a660_final.sh

    - name: Create update.json
      run: |
        cat <<EOF >"turnip_workdir/update.json"
        {
          "versionCode": "$(cat turnip_workdir/mesa-main/VERSION | tr -cd '0-9')",
          "version": "$(cat turnip_workdir/mesa-main/VERSION)",
          "zipUrl": "https://github.com/${{ github.repository }}/releases/download/github_run/turnip_a660_final_adrenotools.zip",
          "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/changelog.md"
        }
        EOF

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      with:
        name: meson-ninja-logs
        path: |
          turnip_workdir/ninja_log
          turnip_workdir/mesa-main/build-android-aarch64/meson-logs/meson-log.txt

    - name: Release "turnip"
      uses: softprops/action-gh-release@v1
      with:
        body: Turnip driver package for adrenotools - Adreno 660, built from Mesa main
        tag_name: github_run
        name: Weekly Action Release
        files: |
           turnip_workdir/update.json
           turnip_workdir/turnip_a660_final_adrenotools.zip
